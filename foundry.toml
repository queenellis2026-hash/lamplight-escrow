[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Round 6 (Oct 27, 2026): the invariant test needs a sane call budget.
# This forge version defaults depth to 500 (256 runs x 500 calls =
# 128,000 handler calls), which makes `forge test` take many minutes.
# 256 x 15 is the historical default and is plenty for the handler.
[invariant]
runs = 256
depth = 15

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
